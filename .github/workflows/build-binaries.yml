name: Build Client Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js (v18 required for pkg targets)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: clientServer/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd clientServer
          pnpm install --frozen-lockfile

      - name: Build Linux x64
        run: |
          cd clientServer
          pnpm run build:linux-x64

      - name: Build Linux ARM64
        run: |
          cd clientServer
          pnpm run build:linux-arm64

      - name: Build Windows x64
        run: |
          cd clientServer
          pnpm run build:win-x64

      - name: Build macOS x64
        run: |
          cd clientServer
          pnpm run build:macos-x64 || echo "macOS build skipped (optional)"

      - name: Build Termux (linuxstatic-arm64)
        id: termux
        continue-on-error: true
        run: |
          cd clientServer
          pnpm run build:termux
        env:
          PKG_BUILD_PATH: /tmp/pkg-build

      - name: Collect binaries
        run: |
          cd clientServer
          mkdir -p release
          cp -v dist/apex-* release/ 2>/dev/null || true
          ls -la release/

      - name: Upload Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-client-binaries
          path: clientServer/release/
          retention-days: 5
